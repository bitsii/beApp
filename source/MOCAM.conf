
# Start in daemon (background) mode and release terminal (default: off)
daemon off

#pixels to trigger motion event default 1500
threshold 4000
#threshold 10000000000

#def off
threshold_tune on

#def 32
noise_level 64

#def off
noise_tune on

#despecl for improving pixel detection (dropping specs) def none
#despeckle EedDl

#webcam_localhost off
#webcam_port 8990

#for http control
webcontrol_localhost on

#user:pass for auth, default off
#control_authentication user:pass

#pre captured picframes, default 1
pre_capture 0

#def 100
framerate 10

#def 60
event_gap 20

#on_picture_save ./App/IUCam/picUpload.sh %f

#def 1
minimum_motion_frames 2

#on off first best
output_pictures first
