<html>
<head>

<style>

}

}

p.luiForm {

}

    width: 260px;margin:0;padding:0;
}

    top:0;

}

<body>
<div id="logindiv">
<p>Login</p>
<form>
<p><label class="luiForm">Account Name</label><input type="text" id="accountName"></input></p>
<p><label class="luiForm">Account Password</label><input type="password" id="accountPass" onkeydown = "if (event.keyCode == 13) dzeui.bem_login_0()"></input></p>
</form>
<p><a href="#" onclick="dzeui.bem_login_0();return false;">Login</a></p>
</div>
<div id="loginmsgdiv"></div>

<p><a href="#" onclick="dzeui.bem_logout_0();return false;">Logout</a></p>
<p><a id="showDevsId" href="#" onclick="dzeui.bem_showDevLinks_0();return false;">Linked Devices</a></p>
<div id="devsDiv"></div>
<p><a href="#" onclick="dzeui.bem_hideDevLinks_0();return false;">Close Linked Devices</a></p>
<div id="offerDevLinkDiv" style="display: none;">

<p><label class="luiForm">Offer to Email</label><input type="text" id="offerEmail"></input></p>

<p><label class="luiForm">Repeat Password</label><input type="password" id="offerPass2"</input></p>
<p><a href="#" onclick="dzeui.bem_offerLink_0();return false;">Send Link Offer</a></p>
</form>
</div>
<p><a id="showAdminId" href="#" onclick="dzeui.bem_showAdmin_0();return false;" style="display: none;">Administration</a></p>
<div id="admindiv" style="display: none;">
<p><a id="hideAdminId" href="#" onclick="dzeui.bem_hideAdmin_0();return false;" >Close Administration</a></p>
<p><a id="detectCamsId" href="#" onclick="dzeui.bem_detectCams_0();return false;" >Detect WebCams</a></p>

</div>
<div id="configsDiv"></div>
<div id="camLinksDiv"></div>
<div id="cmdLinksDiv"></div>
<p><a id="localBrowseId" href="#" onclick="dzeui.bem_localBrowseRequest_0();return false;">Browse Files</a></p>

<p>Upload a File <input type="file" id="files" name="files[]" multiple /></p>
<p>Confirm file deletion <input type="checkbox" id="confirmDeleteId"/></p>
<p><label class="luiForm">Copy to File Name</label><input type="text" id="copyNameId"></input></p>
<div id="localBrowseListDiv"></div>
</div>
<script>
document.getElementById('files').addEventListener('change', handleFileSelect, false);
</script>
<p><a href="#" id="clearPicId" onclick="dzeui.bem_clearImage_0();return false;" style="display: none;">Clear Picture</a></p>
<div id="imgdiv"></div>
</div>

</html>
