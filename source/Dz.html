<html>
<head>
    <meta charset="UTF-8">
<style>

label.luiForm {
    width: 120px; float: left;margin:0;padding:0;
}

input.luiFormField {
    width: 140px;margin:0;padding:0;clear: right;
}

input.luiForm {
    width: 260px;margin:0;padding:0;
}

p.luiForm {
    width: 260px;margin:0;padding:0;
}

h5.luiForm {
    width: 260px;margin:0;padding:0;
}

#alertDiv {
    top:0;
    left:0;
    width:100%;
    height:150%;
    display:none;
}

</style>
<script type="text/javascript" src="BEL_4_Base.js">
</script>
</head>
<body>
<div id="logindiv">
<p>Login</p>
<form>
<p><label class="luiForm">Account Name</label><input type="text" id="loginName"></input></p>
<p><label class="luiForm">Account Password</label><input type="password" id="loginPass" onkeydown = "if (event.keyCode == 13) login()"></input></p>
</form>
<p><a href="#" onclick="login();return false;">Login</a></p>
</div>
<div id="loginmsgdiv"></div>
<div id="loggedindiv" style="display: none;">
<p><a href="#" onclick="logout();return false;">Logout</a></p>
<p>Command<input type="text" id="cmd"></input></p>
<p><a id="runCommandId" href="#" onclick="runCommand();return false;" style="display: none;">Run Command</a></p>
<p><a id="playSoundId" href="#" onclick="playSound();return false;" style="display: none;">Play Sound</a></p>
<p><a id="detectCamsId" href="#" onclick="detectCams();return false;" style="display: none;">Detect WebCams</a></p>
<p><a href="#" onclick="clearImage();return false;">Clear Picture</a></p>
<div id="camLinksDiv"></div>
<div id="imgdiv"></div>
</body>
</html>
