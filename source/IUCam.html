<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  
body {
    font-family: Roboto, 'Segoe UI', Tahoma, sans-serif;
    /*font-size: 81.25%;*/
    font-size: 90%;
    font-weight: 600;
    background-color:rgb(200,200,200);
}

:link { color: #000000; }
:visited { color: #000000; }

img { 
margin-left:5px; 
margin-right:5px; 
margin-top:5px; 
margin-bottom:5px; 
} 

label.luiForm {
    width: 120px; float: left;margin:0;padding:0;
}

input.luiFormField {
    width: 140px;margin:0;padding:0;clear: right;
}

input.luiForm {
    width: 260px;margin:0;padding:0;
}

p.luiForm {
    width: 260px;margin:0;padding:0;
}

h5.luiForm {
    width: 260px;margin:0;padding:0;
}

#alertDiv {
    top:0;
    left:0;
    width:100%;
    height:150%;
    display:none;
}

</style>
<script type="text/javascript" src="IUCam_BEL_4_Base.js">
</script>
</head>
<body>
<div id="informDiv" style="display: none;">
<div id="informMessageDiv"></div>
<p><a href="#" onclick="ui.bem_hideInform_0();return false;">Clear Message</a></p>
</div>
<div id="logindiv">
<p>Login</p>
<form>
<p><label class="luiForm">Account Name</label><input type="text" id="accountName"></input></p>
<p><label class="luiForm">Account Password</label><input type="password" id="accountPass" onkeydown = "if (event.keyCode == 13) ui.bem_login_0()"></input></p>
<!--<p><label class="luiForm">Session Name</label><input type="text" id="sessionName" onkeydown = "if (event.keyCode == 13) ui.bem_login_0()"></input>(Optional)</p>-->
<input type="hidden" id="sessionName" value=""/>
</form>
<p><a href="#" onclick="ui.bem_login_0();return false;">Login</a></p>
</div>
<div id="loginmsgdiv"></div>
<div id="loggedindiv" style="display: none;">

<!--IUCam-->
<a id="hubLink" href="IUHub.html"><img src="help-about.svg" title="IUCam"/></a>
<!--IUCam-->

<!--Files-->
<img src="folder-videos.svg" onclick="ui.bem_browseWebCam_0();return false;" title="WebCam Files"/>
<!--Files-->

<!--Configure Cams-->
<img src="shotwell.svg" onclick="callUI('toggleCamSettings');return false;" title="Cam Settings"/>
<!--Configure Cams-->

<!--Logout-->
<img src="system-log-out.svg" onclick="ui.bem_logout_0();return false;" title="Logout"/>
<!--Logout-->
  
<div id="actionLinksDiv"></div>
<p><a href="#" id="clearPicId" onclick="ui.bem_clearImage_0();return false;" style="display: none;">Clear Picture</a></p>
